server:
  port: 8080
  # SSE 长连接需要关闭压缩/缓冲，这里保持默认，靠后端 flush

spring:
  application:
    name: rag-lab

  # ------------------------------------------------------------
  # 读取项目根目录的 .env（按 properties 格式解析）
  # optional: 前缀 = 文件不存在也不报错，纯靠系统环境变量也能跑
  # 注意：依赖启动时的工作目录，请在项目根目录启动
  # ------------------------------------------------------------
  config:
    import:
      - optional:file:./.env[.properties]

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/rag_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: root
    # 不要把密码写在这里当默认值 —— 仓库一旦公开就是明文泄露。
    # 本地放到 .env（已在 .gitignore 里），部署走环境变量。
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: raglab-pool

  # 启动时自动执行 db/schema.sql（全部 IF NOT EXISTS，可重复执行）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mvc:
    async:
      request-timeout: 1800000

logging:
  level:
    root: INFO
    com.raglab: DEBUG

raglab:
  embedding:
    # Qwen（DashScope）OpenAI 兼容模式
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 优先 .env 里的 QWEN_API_KEY；没填则回退系统的 DASHSCOPE_API_KEY
    api-key: ${QWEN_API_KEY:${DASHSCOPE_API_KEY:}}
    model: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${QWEN_EMBEDDING_DIMENSIONS:1024}
    # DashScope 单次请求最多 10 条文本
    batch-size: 10
    timeout-seconds: 60
    max-retries: 2

  chroma:
    # 你本地 docker-compose 起的 Chroma 实际映射端口
    base-url: ${CHROMA_BASE_URL:http://127.0.0.1:58019}
    tenant: default_tenant
    database: default_database
    collection: ${CHROMA_COLLECTION:raglab_chunks}
    timeout-seconds: 60
    # 写入 Chroma 的批大小
    write-batch-size: 20

  chunk:
    # 单片目标字符数（文章建议 200-500 字）
    size: ${CHUNK_SIZE:500}
    # 相邻切片重叠字符数
    overlap: ${CHUNK_OVERLAP:80}
    # 小于该长度的碎片（非尾块）会被并入上一片
    min-size: 60

  log:
    # 运行日志保留天数。<=0 表示永久保留（不推荐，表会一直涨）
    # 每天 03:30 自动清理，按 created_at 索引走，不会全表扫
    retention-days: ${LOG_RETENTION_DAYS:30}

  rerank:
    # DashScope 原生 rerank 接口（不是 OpenAI 兼容协议）
    # 复用 embedding 那套 API Key，换服务地址即可
    base-url: ${RERANK_BASE_URL:https://dashscope.aliyuncs.com}
    model: ${RERANK_MODEL:gte-rerank-v2}
    timeout-seconds: 60
    # 单次送给重排模型的候选上限，太多会超 token 限制
    max-documents: 50

  context:
    # VECTOR = 句子级向量检索（准，要额外调 embedding）
    # KEYWORD = 关键词密度（快，不花钱，但粗糙）
    strategy: ${CONTEXT_STRATEGY:VECTOR}
    # 每个切片最多贡献几句，防止某一片把所有名额占满
    max-sentences-per-chunk: 4
    # 最终上下文长度上限（中文 1 字约 0.7 token，1200 字约 840 token）
    max-chars: 1200
    # 两句相似度超过这个值只留一条（阶段一的 overlap 会让相邻切片重复）
    dedup-threshold: 0.85

  # ============ 阶段六：评测 ============
  eval:
    # 取前几条算指标。要和实际喂给大模型的条数一致，否则指标好看但没意义
    top-k: ${EVAL_TOP_K:5}
    # 混合检索 / 重排的召回条数
    recall-topn: ${EVAL_RECALL_TOPN:20}
    # 默认评测的策略组合
    strategies: ${EVAL_STRATEGIES:VECTOR,HYBRID,RERANK,CONTEXT,REWRITE}

  # ============ 阶段七：生成 ============
  generate:
    # 和 embedding 同一个兼容端点，只是换 model 名
    base-url: ${GENERATE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${GENERATE_MODEL:qwen-plus}
    # RAG 问答要的是忠于资料，不是发挥。0 太死板，0.2 比较稳
    temperature: ${GENERATE_TEMPERATURE:0.2}
    max-tokens: ${GENERATE_MAX_TOKENS:1200}
    timeout-seconds: 90

  # ============ 阶段八：查询重写 ============
  rewrite:
    # 改写几个变体（不含原查询）。2~3 是性价比区间：再多收益递减、LLM 成本线性涨
    variants: ${REWRITE_VARIANTS:3}
    # 改写要多样性，温度比问答高
    temperature: ${REWRITE_TEMPERATURE:0.7}
    # 原查询在跨变体融合里的权重。
    # 实测：设成 2 会把原查询的 20 条全部压在变体结果之前（2/61 > 1/61），
    # 变体只能靠「多个变体都命中」才能挤进 Top-K —— 改写几乎白做。
    # 用 1 时原查询仍然是锚（排在第一位），但变体 Top-1 也有机会进榜。
    original-weight: ${REWRITE_ORIGINAL_WEIGHT:1}
    # 融合后是否再过一遍重排（多花一次 rerank 调用）
    rerank: ${REWRITE_RERANK:true}

  # ============ 阶段九：多层缓存 ============
  cache:
    enabled: ${CACHE_ENABLED:true}
    # 过期时间（秒）。知识库越稳定可以越长；否则会拿到「旧知识库」的答案
    ttl-seconds: ${CACHE_TTL_SECONDS:1800}
    # L1 内存条数（LRU）
    capacity: 200
    # L3 语义索引条数（暴力比对，太多会变慢）
    semantic-capacity: 300
    # 语义命中阈值。**必须用你自己的 embedding 模型实测分布来定**：
    #   本项目实测（Qwen text-embedding-v4）：
    #     同义改写   0.68 ~ 0.84（"模型的采集深度执行哪一级" 0.8406）
    #     不同问题   0.26 ~ 0.45（"数据交付平台有哪些功能" 0.2833）
    #   所以 0.95 在这套模型上等于「关闭语义缓存」—— 措辞一变就掉到 0.85 以下。
    #   0.80 只放行最像的那几条；调低到 0.6 以下会开始出现「问 A 答 B」。
    semantic-threshold: ${CACHE_SEMANTIC_THRESHOLD:0.80}
    redis-host: ${REDIS_HOST:127.0.0.1}
    redis-port: ${REDIS_PORT:6379}
    prefix: "raglab:cache:"
